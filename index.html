<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Auditoría de fibroscopios</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f3;--card:#fff;--ink:#14272b;--mut:#5d7176;--line:#d3dde0;--acc:#0e6b73;--ok:#1b7f4b;--okbg:#dff3e7;--bad:#b3261e;--badbg:#fbe1de;--na:#5d6b75;--nabg:#e4e9ec;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1a1c;--card:#172628;--ink:#e6f0f1;--mut:#90a8ad;--line:#2b4044;--acc:#4cc2cc;--ok:#6fd49b;--okbg:#17382a;--bad:#ff9b92;--badbg:#401c19;--na:#a9b8c0;--nabg:#26363b}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1a1c;--card:#172628;--ink:#e6f0f1;--mut:#90a8ad;--line:#2b4044;--acc:#4cc2cc;--ok:#6fd49b;--okbg:#17382a;--bad:#ff9b92;--badbg:#401c19;--na:#a9b8c0;--nabg:#26363b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 60px}
h1{font-size:19px;font-weight:600;margin:0 0 12px}
h2{font-size:18px;font-weight:600;margin:0}
button,input{font:inherit}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.bar button,.back,.link{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer}
.month{flex:1;text-align:center;font-weight:600;text-transform:capitalize}
input[type=search],.add input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:12px 0}
.wd{text-align:center;font-size:13px;color:var(--mut);padding:2px 0}
.cell{aspect-ratio:1/1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;font-weight:500}
.cell.blank{visibility:hidden}
.cell.today{border:2px solid var(--acc);color:var(--acc);font-weight:600}
.dots{display:flex;gap:3px;height:6px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.has{background:var(--acc)}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sub{color:var(--mut);font-size:14px}
.cap{text-transform:capitalize}
.turn{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:18px 16px;margin-bottom:10px;cursor:pointer}
.turn b{display:block;font-size:18px;font-weight:600}
.turn span{color:var(--mut);font-size:14px}
.turn em{font-style:normal;color:var(--acc);font-weight:600;font-size:14px;text-align:right}
.add{display:flex;gap:6px;margin-bottom:12px}
.add button{border:0;background:var(--acc);color:var(--bg);border-radius:8px;padding:0 16px;font-weight:600;cursor:pointer}
.row{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.row.bad{border-color:var(--bad)}
.rt{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rt+.st{margin-top:8px}
.sn{font-weight:600;word-break:break-all}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.st button{border:1px solid var(--line);background:transparent;color:var(--mut);border-radius:8px;padding:10px 4px;cursor:pointer}
.st .on-ok{background:var(--okbg);color:var(--ok);border-color:var(--ok);font-weight:600}
.st .on-bad{background:var(--badbg);color:var(--bad);border-color:var(--bad);font-weight:600}
.st .on-na{background:var(--nabg);color:var(--na);border-color:var(--na);font-weight:600}
.del{border:0;background:transparent;color:var(--mut);cursor:pointer;padding:6px 8px;font-size:14px}
.del.sure{color:var(--bad);font-weight:600}
.ev{display:flex;align-items:center;gap:10px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.ev img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer}
.ev label,.ev button{border:1px solid var(--bad);color:var(--bad);background:transparent;border-radius:8px;padding:9px 12px;cursor:pointer;font-size:14px;font-weight:500}
.ev button.quiet{border-color:var(--line);color:var(--mut)}
.ev input{display:none}
.empty{padding:18px;color:var(--mut);text-align:center}
.res{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.res small{display:block;color:var(--mut)}
.tag{font-size:13px;font-weight:600}
.tag.ok{color:var(--ok)}.tag.bad{color:var(--bad)}.tag.na{color:var(--na)}
.msg{color:var(--bad);font-size:14px;margin:-6px 0 10px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.ov img{max-width:100%;max-height:100%;border-radius:8px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-14px -14px 14px;padding:10px 14px;background:var(--acc);color:var(--bg)}
.topbar b{font-size:20px;letter-spacing:.04em}
.topbar span{flex:1;text-align:right;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar button{border:1px solid currentColor;background:transparent;color:inherit;border-radius:8px;padding:5px 10px;cursor:pointer}
.cover{min-height:80vh;display:flex;flex-direction:column;justify-content:center;gap:10px}
.cover .badge{font-size:72px;font-weight:600;line-height:1;color:var(--acc)}
.cover h1{font-size:28px;margin:0 0 18px}
.cover label{font-size:14px;color:var(--mut)}
.cover input{width:100%;padding:13px 12px;margin-top:4px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.cover .go{width:100%;margin-top:14px;border:0;background:var(--acc);color:var(--bg);border-radius:8px;padding:14px;font-weight:600;cursor:pointer}
.ev{flex-wrap:wrap}
.ev label.quiet{border-color:var(--line);color:var(--mut)}
.camov{position:fixed;inset:0;background:#000;z-index:30;display:flex;flex-direction:column}
.camov video{flex:1;min-height:0;width:100%;object-fit:contain;background:#000}
.camb{display:flex;gap:12px;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.camb button{flex:1;border:0;border-radius:10px;padding:16px;font-weight:600;font-size:16px;cursor:pointer;background:#fff;color:#000}
.camb .cs{background:var(--acc);color:var(--bg)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const SHIFTS=[["t1","Turno 1","7:00 a 15:00"],["t2","Turno 2","15:00 a 23:00"],["t3","Turno 3","23:00 a 7:00"]];
const LBL={ok:"Bien",bad:"Mal",na:"No aplica"};
const KEY="audit-fibro-v2";
let db={fibs:[],rec:{}};   // fibs: [serie]; rec: {"fecha|turno":{serie:{s,p}}}
try{db=JSON.parse(localStorage.getItem(KEY)||"null")||db}catch(e){}
if(!db.fibs.length){ // migrar datos de la versión anterior
  try{const old=JSON.parse(localStorage.getItem("audit-fibro-v1")||"{}");
    Object.keys(old).forEach(k=>old[k].forEach(r=>{if(!db.fibs.includes(r.sn))db.fibs.push(r.sn);(db.rec[k]=db.rec[k]||{})[r.sn]={s:r.s||"",p:""}}));
  }catch(e){}
}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}};

// Fotos: IndexedDB, con copia en memoria
const photos={};
let idb=null;
function openIDB(){return new Promise(res=>{try{const r=indexedDB.open("fibro-fotos",1);
  r.onupgradeneeded=()=>r.result.createObjectStore("p");
  r.onsuccess=()=>{idb=r.result;res()};r.onerror=()=>res()}catch(e){res()}})}
function idbPut(id,v){try{idb&&idb.transaction("p","readwrite").objectStore("p").put(v,id)}catch(e){}}
function idbDel(id){try{idb&&idb.transaction("p","readwrite").objectStore("p").delete(id)}catch(e){}}
function idbLoad(){return new Promise(res=>{if(!idb)return res();try{
  const q=idb.transaction("p").objectStore("p").openCursor();
  q.onsuccess=()=>{const c=q.result;if(c){photos[c.key]=c.value;c.continue()}else res()};q.onerror=()=>res()}catch(e){res()}})}
function compress(file){return new Promise((res,rej)=>{
  const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const m=1000,k=Math.min(1,m/Math.max(im.width,im.height));
    const c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",.72))};
  im.onerror=()=>rej();im.src=u})}

const now=new Date();
const pad=n=>String(n).padStart(2,"0");
const dkey=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const pdate=k=>{const[a,b,c]=k.split("-");return new Date(+a,+b-1,+c)};
const longd=k=>pdate(k).toLocaleDateString("es-MX",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let view="cal",cur=new Date(now.getFullYear(),now.getMonth(),1),day=null,shift=null,term="",fterm="",big="",sure=-1,msg="";
const app=document.getElementById("app");
let loginErr="";const USR="gdldycar",PWD="flex123";
let user="";try{user=localStorage.getItem("audit-fibro-user")||""}catch(e){}
if(user!==USR)user="";
const getRec=(k,sn)=>(db.rec[k]||{})[sn]||{s:"",p:""};
const shiftCount=k=>Object.values(db.rec[k]||{}).filter(r=>r.s).length;

function calView(){
  const y=cur.getFullYear(),m=cur.getMonth(),n=new Date(y,m+1,0).getDate();
  const off=(new Date(y,m,1).getDay()+6)%7,tk=dkey(now);
  let g=["L","M","M","J","V","S","D"].map(x=>`<div class="wd">${x}</div>`).join("");
  for(let i=0;i<off;i++)g+=`<div class="cell blank"></div>`;
  for(let d=1;d<=n;d++){
    const k=dkey(new Date(y,m,d));
    const dots=SHIFTS.map(([id])=>`<i class="${shiftCount(k+"|"+id)?"has":""}"></i>`).join("");
    g+=`<button class="cell ${k===tk?"today":""}" data-a="day" data-k="${k}">${d}<span class="dots">${dots}</span></button>`;
  }
  let res="";
  if(term){
    const t=term.toLowerCase(),out=[];
    Object.keys(db.rec).sort().reverse().forEach(key=>{
      const[k,id]=key.split("|");
      Object.keys(db.rec[key]).forEach(sn=>{const r=db.rec[key][sn];if(r.s&&sn.toLowerCase().includes(t))out.push([k,id,sn,r])});
    });
    res=out.length?out.map(([k,id,sn,r])=>`<button class="res" data-a="goto" data-k="${k}" data-id="${id}"><b>${esc(sn)}</b> <span class="tag ${r.s}">${LBL[r.s]}</span><small class="cap">${longd(k)}, ${SHIFTS.find(s=>s[0]===id)[1]}</small></button>`).join(""):`<div class="empty">No hay revisiones con ese número de serie.</div>`;
  }
  return `<h1>Auditoría de fibroscopios</h1>
  <div style="display:flex;gap:8px"><input id="q" type="search" placeholder="Buscar número de serie en el historial" value="${esc(term)}" autocomplete="off"><button class="link" data-a="fibs" style="white-space:nowrap">Fibroscopios (${db.fibs.length})</button></div>
  ${term?`<div style="margin-top:12px">${res}</div>`:`
  <div class="bar" style="margin-top:14px"><button data-a="prev" aria-label="Mes anterior">‹</button><div class="month">${cur.toLocaleDateString("es-MX",{month:"long",year:"numeric"})}</div><button data-a="next" aria-label="Mes siguiente">›</button></div>
  <div class="grid">${g}</div>
  <div class="sub">Elige un día. Los puntos marcan los turnos que ya tienen revisiones.</div>`}`;
}
function fibsView(){
  return `<div class="top"><button class="back" data-a="home">‹ Calendario</button><h2>Fibroscopios</h2></div>
  <div class="sub" style="margin-bottom:10px">Agrégalos una sola vez. Aparecen en los tres turnos de todos los días.</div>
  <form class="add" id="fibf"><input id="nsn" placeholder="Número de serie" autocomplete="off"><button type="button" data-a="addfib">Agregar</button></form>
  ${msg?`<div class="msg">${msg}</div>`:""}
  ${db.fibs.length?db.fibs.map((sn,i)=>`<div class="row"><div class="rt"><span class="sn">${esc(sn)}</span><button class="del ${sure===i?"sure":""}" data-a="rmfib" data-i="${i}">${sure===i?"¿Quitar?":"Quitar"}</button></div></div>`).join(""):`<div class="empty">Todavía no hay fibroscopios.</div>`}`;
}
function dayView(){
  return `<div class="top"><button class="back" data-a="home">‹ Calendario</button></div>
  <h2 class="cap" style="margin-bottom:14px">${longd(day)}</h2>
  ${SHIFTS.map(([id,name,hrs])=>{
    const c=shiftCount(day+"|"+id),n=db.fibs.length;
    return `<button class="turn" data-a="shift" data-id="${id}"><div><b>${name}</b><span>${hrs}</span></div><em>${n?c+" de "+n+"<br>revisados":"Sin fibroscopios"}</em></button>`}).join("")}`;
}
function shiftView(){
  const s=SHIFTS.find(x=>x[0]===shift),key=day+"|"+shift,f=fterm.toLowerCase();
  const rows=db.fibs.map((sn,i)=>({sn,i})).filter(({sn})=>!f||sn.toLowerCase().includes(f));
  const html=rows.map(({sn,i})=>{
    const r=getRec(key,sn);
    return `<div class="row ${r.s==="bad"?"bad":""}"><div class="rt"><span class="sn">${esc(sn)}</span></div>
    <div class="st">${["ok","bad","na"].map(v=>`<button class="${r.s===v?"on-"+v:""}" data-a="set" data-i="${i}" data-v="${v}">${LBL[v]}</button>`).join("")}</div>
    ${r.s==="bad"?`<div class="ev">${r.p&&photos[r.p]?`<img src="${photos[r.p]}" alt="Evidencia" data-a="zoom" data-p="${r.p}"><button data-a="cam" data-i="${i}">Tomar otra</button><input type="file" accept="image/*" capture="environment" data-i="${i}" data-cap="${i}"><button class="quiet" data-a="rmphoto" data-i="${i}">Quitar</button>`:`<button data-a="cam" data-i="${i}">Tomar foto</button><input type="file" accept="image/*" capture="environment" data-i="${i}" data-cap="${i}"><label class="quiet">Elegir de galería<input type="file" accept="image/*" data-i="${i}"></label>`}</div>`:""}</div>`}).join("");
  return `<div class="top"><button class="back" data-a="backday">‹ Turnos</button><div><h2>${s[1]}, ${s[2]}</h2><div class="sub cap">${longd(day)}</div></div></div>
  ${db.fibs.length>3?`<input id="fq" type="search" placeholder="Buscar número de serie" value="${esc(fterm)}" style="margin-bottom:12px">`:""}
  ${html||`<div class="empty">${db.fibs.length?"Ningún fibroscopio coincide.":"Primero agrega tus fibroscopios."}</div>`}
  ${db.fibs.length?"":`<div style="text-align:center"><button class="link" data-a="fibs">Agregar fibroscopios</button></div>`}`;
}
function coverView(){
  return `<div class="cover"><div class="badge">B23</div><h1>Auditoría de fibroscopios</h1>
  <form id="loginf"><label for="usr">Usuario</label><input id="usr" autocomplete="username" autocapitalize="none" autocorrect="off"><label for="pwd" style="display:block;margin-top:10px">Contraseña</label><input id="pwd" type="password" autocomplete="current-password">${loginErr?`<div class="msg" style="margin:8px 0 0">${loginErr}</div>`:""}<button class="go" type="button" data-a="login">Iniciar sesión</button></form></div>`;
}
function topbar(){return `<div class="topbar"><b>B23</b><span>${esc(user)}</span><button data-a="logout">Salir</button></div>`}
function render(focus){
  app.innerHTML=!user?coverView():topbar()+(view==="cal"?calView():view==="fibs"?fibsView():view==="day"?dayView():shiftView())+(big&&photos[big]?`<div class="ov" data-a="unzoom"><img src="${photos[big]}" alt="Evidencia"></div>`:"");
  const el=focus&&document.getElementById(focus);
  if(el){el.focus();el.setSelectionRange&&el.setSelectionRange(el.value.length,el.value.length)}
}
function setRec(sn,patch){const key=day+"|"+shift;db.rec[key]=db.rec[key]||{};db.rec[key][sn]=Object.assign(getRec(key,sn),patch);save()}

app.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b)return;
  const a=b.dataset.a,y=scrollY,key=day+"|"+shift;
  if(a==="login"){doLogin();return}
  if(a==="addfib"){doAddFib();return}
  if(a==="cam"){openCam(+b.dataset.i);return}
  if(a==="prev")cur=new Date(cur.getFullYear(),cur.getMonth()-1,1);
  else if(a==="next")cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);
  else if(a==="day"){day=b.dataset.k;view="day";scrollTo(0,0)}
  else if(a==="goto"){day=b.dataset.k;shift=b.dataset.id;fterm="";view="shift";scrollTo(0,0)}
  else if(a==="shift"){shift=b.dataset.id;fterm="";view="shift";scrollTo(0,0)}
  else if(a==="home"){view="cal";sure=-1;msg="";scrollTo(0,0)}
  else if(a==="fibs"){view="fibs";msg="";scrollTo(0,0)}
  else if(a==="backday"){view="day";scrollTo(0,0)}
  else if(a==="set"){
    const sn=db.fibs[+b.dataset.i],r=getRec(key,sn),v=b.dataset.v,nv=r.s===v?"":v;
    if(nv!=="bad"&&r.p){idbDel(r.p);delete photos[r.p];r.p=""}
    setRec(sn,{s:nv,p:r.p});
  }
  else if(a==="rmphoto"){const sn=db.fibs[+b.dataset.i],r=getRec(key,sn);idbDel(r.p);delete photos[r.p];setRec(sn,{p:""})}
  else if(a==="zoom")big=b.dataset.p;
  else if(a==="unzoom")big="";
  else if(a==="logout"){user="";try{localStorage.removeItem("audit-fibro-user")}catch(e){}view="cal";term=""}
  else if(a==="rmfib"){const i=+b.dataset.i;if(sure===i){db.fibs.splice(i,1);sure=-1;save()}else sure=i}
  render();
  if(["set","rmphoto","zoom","unzoom"].includes(a))scrollTo(0,y);
});
app.addEventListener("input",e=>{
  if(e.target.id==="q"){term=e.target.value.trim();render("q")}
  if(e.target.id==="fq"){fterm=e.target.value.trim();render("fq")}
});
app.addEventListener("change",async e=>{
  const inp=e.target;if(inp.type!=="file"||!inp.files[0])return;
  const sn=db.fibs[+inp.dataset.i],y=scrollY;
  try{
    const url=await compress(inp.files[0]),r=getRec(day+"|"+shift,sn);
    if(r.p){idbDel(r.p);delete photos[r.p]}
    const id="f"+Date.now()+Math.random().toString(36).slice(2,6);
    photos[id]=url;idbPut(id,url);setRec(sn,{p:id});
  }catch(err){}
  render();scrollTo(0,y);
});
let camFail=false;
function fallbackCam(i){const f=app.querySelector('input[data-cap="'+i+'"]');if(f)f.click()}
function savePhoto(i,url){
  const sn=db.fibs[i],r=getRec(day+"|"+shift,sn);
  if(r.p){idbDel(r.p);delete photos[r.p]}
  const id="f"+Date.now()+Math.random().toString(36).slice(2,6);
  photos[id]=url;idbPut(id,url);setRec(sn,{p:id});
}
function openCam(i){
  const md=navigator.mediaDevices;
  if(camFail||!md||!md.getUserMedia){fallbackCam(i);return}
  const ov=document.createElement("div");ov.className="camov";
  ov.innerHTML='<video playsinline muted autoplay></video><div class="camb"><button type="button" class="cx">Cancelar</button><button type="button" class="cs">Capturar</button></div>';
  document.body.appendChild(ov);
  const v=ov.querySelector("video");let stream=null,closed=false;
  const close=()=>{closed=true;if(stream)stream.getTracks().forEach(t=>t.stop());ov.remove()};
  ov.querySelector(".cx").onclick=close;
  ov.querySelector(".cs").onclick=()=>{
    if(!v.videoWidth)return;
    const k=Math.min(1,1000/Math.max(v.videoWidth,v.videoHeight)),c=document.createElement("canvas");
    c.width=Math.round(v.videoWidth*k);c.height=Math.round(v.videoHeight*k);
    c.getContext("2d").drawImage(v,0,0,c.width,c.height);
    const url=c.toDataURL("image/jpeg",.72),y=scrollY;
    close();savePhoto(i,url);render();scrollTo(0,y);
  };
  md.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false})
    .then(s=>{if(closed){s.getTracks().forEach(t=>t.stop());return}stream=s;v.srcObject=s;v.play().catch(()=>{})})
    .catch(()=>{camFail=true;close();fallbackCam(i)});
}
app.addEventListener("submit",e=>e.preventDefault());
function doLogin(){
  const u=document.getElementById("usr").value.trim(),p=document.getElementById("pwd").value.trim();
  if(u.toLowerCase()!==USR||p!==PWD){loginErr="Usuario o contraseña incorrectos.";render();document.getElementById("usr").value=u;return}
  loginErr="";user=USR;try{localStorage.setItem("audit-fibro-user",USR)}catch(err){}
  view="cal";render();scrollTo(0,0);
}
function doAddFib(){
  const inp=document.getElementById("nsn"),sn=inp.value.trim();
  if(!sn)return;
  if(db.fibs.some(x=>x.toLowerCase()===sn.toLowerCase())){msg="Ese número de serie ya está en la lista.";render("nsn");return}
  db.fibs.push(sn);msg="";save();render("nsn");
}
app.addEventListener("keydown",e=>{
  if(e.key!=="Enter")return;
  const id=e.target.id;
  if(id==="usr"||id==="pwd"){e.preventDefault();doLogin()}
  else if(id==="nsn"){e.preventDefault();doAddFib()}
});
render();
openIDB().then(idbLoad).then(()=>render());
</script>
